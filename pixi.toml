# Software environment of this project. Edit it with `pixi add <package>`;
# Pixi records the exact versions it installed in pixi.lock (commit both).
[workspace]
name = "nmtf"
description = "Orthogonal NMTF embeddings of a human protein-protein interaction network: PPMI vs adjacency input"
authors = ["keqin peng <pkqpikachu@gmail.com>"]
channels = ["conda-forge"]
# Only the platforms that the GitHub Action (linux-64) and the author (osx-arm64) use or that
# conda-forge builds for the same packages. Windows is not tested, so it is not listed.
platforms = ["linux-64", "osx-arm64", "osx-64"]
version = "0.1.0"

[dependencies]
python = "3.13.*"
numpy = ">=2,<3"
scipy = ">=1.14"
pandas = ">=2.2"
matplotlib = ">=3.9"
pyyaml = ">=6.0.3,<7"
pytest = ">=8"
quarto = ">=1.9"
# Quarto runs the Python code of the report through Jupyter.
ipykernel = ">=7"
nbformat = ">=5"
nbclient = ">=0.10"
jupyter_core = ">=5"
cffconvert = ">=2.0"   # validates CITATION.cff

[tasks]
check = { cmd = "python --version && quarto --version", description = "Check that the tools work" }
test = { cmd = "python -m pytest -q tests", description = "Unit tests of the NMTF code (small synthetic networks)" }
download = { cmd = "python scripts/download_data.py", description = "Download the raw data and verify checksums" }
prepare = { cmd = "python scripts/prepare_data.py", depends-on = ["download"], description = "Build the gene network and the GO annotations used by the analysis" }
embed = { cmd = "python scripts/run_embeddings.py", depends-on = ["prepare"], description = "Embed the network with NMTF (PPMI and adjacency input, several seeds) and test the clusters for GO enrichment" }
report = { cmd = "quarto render reports/nmtf-report.qmd", depends-on = ["embed"], description = "Render the Quarto report" }
# `reproduce` rebuilds every result from the raw data with one command.
reproduce = [{ task = "test" }, { task = "report" }]
cff-check = { cmd = "cffconvert --validate -i CITATION.cff", description = "Validate CITATION.cff" }
